name: Update HR dashboard data
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/update-data.yml'
      - 'scripts/update-dashboard.mjs'
      - 'scripts/google-sheets.mjs'
      - 'scripts/build-php-deploy.mjs'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Recalculate dashboard aggregates
        env:
          MAIN_SHEET_ID: ${{ secrets.MAIN_SHEET_ID }}
          PEOPLE_SHEET_ID: ${{ secrets.PEOPLE_SHEET_ID || '1bsbP6d1f8zHCzMIrSsFiXSrxa8EMXn_EX_kJ4oeW6is' }}
          GOOGLE_SERVICE_ACCOUNT_EMAIL: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_EMAIL }}
          GOOGLE_PRIVATE_KEY: ${{ secrets.GOOGLE_PRIVATE_KEY }}
        run: node scripts/update-dashboard.mjs
      - name: Publish changed data through GitHub Pages
        run: |
          if git diff --quiet -- data.js people-data.js; then exit 0; fi
          git config user.name "hr-dashboard-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data.js people-data.js
          git commit -m "Update HR dashboard data"
          git push
      - name: Build protected hub deployment
        run: node scripts/build-php-deploy.mjs
      - name: Publish current data to hub.rodanika.ru
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.HR_FTP_HOST }}
          username: ${{ secrets.HR_FTP_USER }}
          password: ${{ secrets.HR_FTP_PASSWORD }}
          protocol: ftp
          local-dir: ./.deploy/hr/
          server-dir: /
          state-name: .hr-dashboard-deploy-state.json
